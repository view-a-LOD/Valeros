<app-view-container>
  <app-header [view]="HeaderView.ShowingColophon" />

  <div class="p-8 pt-2 overflow-y-auto h-full">
    @if (colophonComponent) {
      <ng-container *ngComponentOutlet="colophonComponent"></ng-container>
    } @else {
      <p class="mt-8 text-center text-gray-500 italic">
        {{ "colophon.no-custom-colophon" | translate }}
      </p>
    }

    <div class="flex justify-center w-full mt-8">
      <button
        class="btn btn-primary btn-md rounded-box text-center inline-block mx-auto"
        (click)="onButtonClicked('')"
        [attr.aria-label]="'homescreen.go-to-homepage' | translate"
      >
        {{ "general.close" | translate }}
      </button>
    </div>
  </div>
</app-view-container>
