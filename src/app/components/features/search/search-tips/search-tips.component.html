<button
  #triggerButton
  class="btn btn-md px-2 sm:px-3 md:px-4 rounded-box btn-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary focus-visible:outline-offset-2 hover:bg-primary hover:text-primary-content"
  (click)="openModal()"
  [attr.aria-label]="'search-interface.search-tips' | translate"
  aria-controls="searchmodal"
  aria-haspopup="dialog"
  aria-expanded="false"
>
  <ng-icon [svg]="featherInfo" aria-hidden="true" />
</button>

<dialog
  #modal
  class="modal"
  id="searchmodal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="search-tips-title"
  inert
>
  <div class="modal-box max-w-2xl">
    <h3 id="search-tips-title" class="text-lg font-bold mb-4" tabindex="-1">
      {{ "search-interface.search-tips" | translate }}
    </h3>

    @if (searchTipsComponent) {
      <ng-container *ngComponentOutlet="searchTipsComponent"></ng-container>
    } @else {
      <p class="text-sm text-base-content/70">
        {{ "search-interface.no-search-tips" | translate }}
      </p>
    }

    <div class="modal-action">
      <form method="dialog">
        <button
          class="btn btn-primary"
          [attr.aria-label]="'general.close' | translate"
        >
          {{ "general.close" | translate }}
        </button>
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button [attr.aria-label]="'general.close' | translate">
      {{ "general.close" | translate }}
    </button>
  </form>
</dialog>
