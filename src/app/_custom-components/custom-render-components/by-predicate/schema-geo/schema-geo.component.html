@if (data?.value) {
  <app-hop-link
    [data]="{
      value: data!.value!,
      hopLinkSettings: {
        preds: ['https://schema.org/geo', 'https://schema.org/latitude'],
        showHops: true,
      },
    }"
    (hopObjIdsRetrieved)="onLatitude($event)"
    class="hidden"
  />
  <app-hop-link
    [data]="{
      value: data!.value!,
      hopLinkSettings: {
        preds: ['https://schema.org/geo', 'https://schema.org/longitude'],
        showHops: true,
      },
    }"
    (hopObjIdsRetrieved)="onLongitude($event)"
    class="hidden"
  />
  <app-hop-link
    [data]="{
      value: data!.value!,
      hopLinkSettings: {
        preds: ['https://schema.org/geo', 'https://schema.org/polygon'],
        showHops: true,
      },
    }"
    (hopObjIdsRetrieved)="onPolygon($event)"
    class="hidden"
  />
}

<div
  #mapContainer
  class="h-48 w-48 sm:h-64 sm:w-full"
  (click)="$event.preventDefault(); $event.stopPropagation()"
></div>
